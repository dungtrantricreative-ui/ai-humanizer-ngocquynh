services:
  - type: web
    name: ai-humanizer-chatbot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false # Set to true if you want to sync with Render.com dashboard, otherwise manage manually
