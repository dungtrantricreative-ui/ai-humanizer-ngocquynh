<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Humanizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">AI Text Humanizer</h1>
            <div class="flex items-center space-x-2">
                <i class="fas fa-robot text-xl"></i>
                <span class="hidden sm:inline">Powered by Nemotron</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-4 flex flex-col overflow-hidden">
        <div id="chat-container" class="flex-grow bg-white rounded-lg shadow-inner p-4 mb-4 overflow-y-auto space-y-4">
            <!-- Initial Message -->
            <div class="flex items-start">
                <div class="bg-blue-100 text-blue-800 p-3 rounded-lg max-w-2xl">
                    <p>Chào mừng bạn! Hãy paste văn bản AI vào đây, tôi sẽ giúp bạn biến nó trở nên tự nhiên như người viết.</p>
                </div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="bg-white p-4 rounded-lg shadow-md">
            <div class="flex flex-col space-y-4">
                <div class="flex flex-wrap items-center gap-4">
                    <div class="flex-grow">
                        <label for="language-select" class="block text-sm font-medium text-gray-700 mb-1">Ngôn ngữ:</label>
                        <select id="language-select" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="vi">Tiếng Việt (vi)</option>
                            <option value="en" selected>English (en)</option>
                            <option value="zh">Chinese (zh)</option>
                            <option value="ja">Japanese (ja)</option>
                        </select>
                    </div>
                </div>

                <div class="relative">
                    <textarea id="input-text" rows="5" class="w-full border border-gray-300 rounded-md p-3 focus:ring-blue-500 focus:border-blue-500" placeholder="Paste văn bản AI của bạn vào đây..."></textarea>
                </div>

                <div class="flex justify-between items-center">
                    <span id="char-count" class="text-sm text-gray-500">0 characters</span>
                    <button id="humanize-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-colors flex items-center space-x-2">
                        <span>Humanize</span>
                        <i class="fas fa-magic"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex flex-col items-center justify-center z-50">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-white mb-4"></div>
        <p class="text-white text-xl font-semibold">Đang xử lý (Pipeline 4 bước)...</p>
        <p class="text-white text-sm mt-2">Vui lòng đợi trong giây lát</p>
    </div>

    <!-- Template for chat messages -->
    <template id="user-message-template">
        <div class="flex justify-end">
            <div class="bg-gray-200 text-gray-800 p-3 rounded-lg max-w-2xl shadow-sm">
                <p class="whitespace-pre-wrap"></p>
            </div>
        </div>
    </template>

    <template id="ai-message-template">
        <div class="flex items-start flex-col space-y-2">
            <div class="bg-blue-100 text-blue-800 p-3 rounded-lg max-w-2xl shadow-sm relative">
                <p class="whitespace-pre-wrap mb-4"></p>
                <button class="copy-btn absolute bottom-2 right-2 text-blue-600 hover:text-blue-800 text-sm flex items-center space-x-1 bg-white px-2 py-1 rounded shadow-sm border border-blue-200">
                    <i class="far fa-copy"></i>
                    <span>Copy</span>
                </button>
            </div>
        </div>
    </template>

    <script src="/static/app.js"></script>
</body>
</html>
