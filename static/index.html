<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Humanizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
        <!-- Logo/Header -->
        <div class="p-4 border-b border-gray-200">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-wand-magic-sparkles text-white text-sm"></i>
                </div>
                <h1 class="font-bold text-gray-900">Humanizer</h1>
            </div>
        </div>

        <!-- New Chat Button -->
        <div class="p-4">
            <button id="new-chat-btn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-900 font-medium py-2 px-4 rounded-lg transition-colors flex items-center justify-center space-x-2">
                <i class="fas fa-plus"></i>
                <span>Cuộc trò chuyện mới</span>
            </button>
        </div>

        <!-- Chat History -->
        <div class="flex-1 overflow-y-auto px-4 py-2 space-y-2">
            <div class="text-xs text-gray-500 font-semibold px-2 py-2">LỊCH SỬ</div>
            <!-- Chat history items will be added here dynamically -->
        </div>

        <!-- Footer -->
        <div class="p-4 border-t border-gray-200 space-y-2">
            <button class="w-full text-left text-gray-700 hover:bg-gray-100 px-3 py-2 rounded-lg transition-colors text-sm flex items-center space-x-2">
                <i class="fas fa-question-circle"></i>
                <span>Trợ giúp</span>
            </button>
            <button class="w-full text-left text-gray-700 hover:bg-gray-100 px-3 py-2 rounded-lg transition-colors text-sm flex items-center space-x-2">
                <i class="fas fa-cog"></i>
                <span>Cài đặt</span>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col bg-gray-50">
        <!-- Header -->
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
            <h2 class="text-lg font-semibold text-gray-900">AI Text Humanizer</h2>
            <div class="flex items-center space-x-3">
                <button class="text-gray-600 hover:text-gray-900 transition-colors">
                    <i class="fas fa-share text-lg"></i>
                </button>
                <button class="text-gray-600 hover:text-gray-900 transition-colors">
                    <i class="fas fa-ellipsis-vertical text-lg"></i>
                </button>
            </div>
        </header>

        <!-- Chat Area -->
        <main class="flex-1 overflow-y-auto px-6 py-8">
            <div id="chat-container" class="max-w-4xl mx-auto space-y-6">
                <!-- Initial Welcome Message -->
                <div class="flex justify-center">
                    <div class="text-center max-w-2xl">
                        <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-wand-magic-sparkles text-white text-lg"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-900 mb-2">Chào mừng bạn!</h3>
                        <p class="text-gray-600">Hãy paste văn bản AI của bạn vào đây. Tôi sẽ biến nó thành văn bản tự nhiên như người viết, vượt qua mọi AI detector.</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Floating Input Area -->
        <div class="bg-white border-t border-gray-200 px-6 py-6">
            <div class="max-w-4xl mx-auto">
                <!-- Language Selector -->
                <div class="mb-4 flex items-center space-x-2">
                    <label for="language-select" class="text-sm font-medium text-gray-700">Ngôn ngữ:</label>
                    <select id="language-select" class="px-3 py-1 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="vi">Tiếng Việt</option>
                        <option value="en" selected>English</option>
                        <option value="zh">中文</option>
                        <option value="ja">日本語</option>
                    </select>
                </div>

                <!-- Input Area -->
                <div class="relative">
                    <textarea id="input-text" rows="4" class="w-full border border-gray-300 rounded-lg p-4 focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none" placeholder="Dán văn bản AI của bạn vào đây..."></textarea>
                    
                    <!-- Action Buttons -->
                    <div class="absolute bottom-4 right-4 flex items-center space-x-2">
                        <button id="voice-btn" class="text-gray-400 hover:text-gray-600 transition-colors">
                            <i class="fas fa-microphone text-lg"></i>
                        </button>
                        <button id="humanize-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition-colors flex items-center space-x-2">
                            <i class="fas fa-wand-magic-sparkles"></i>
                            <span>Humanize</span>
                        </button>
                    </div>
                </div>

                <!-- Character Count -->
                <div class="mt-2 text-xs text-gray-500 text-right">
                    <span id="char-count">0</span> ký tự
                </div>
            </div>
        </div>
    </div>

    <!-- Status Log Modal (Floating) -->
    <div id="status-modal" class="hidden fixed bottom-8 right-8 bg-white rounded-lg shadow-2xl border border-gray-200 w-96 max-h-96 flex flex-col z-50">
        <!-- Modal Header -->
        <div class="px-4 py-3 border-b border-gray-200 flex justify-between items-center">
            <h3 class="font-semibold text-gray-900 flex items-center space-x-2">
                <i class="fas fa-list-check text-blue-600"></i>
                <span>Tiến trình xử lý</span>
            </h3>
            <button id="close-status-modal" class="text-gray-400 hover:text-gray-600">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Status Content -->
        <div id="status-content" class="flex-1 overflow-y-auto px-4 py-4 space-y-3">
            <!-- Status items will be added here dynamically -->
        </div>
    </div>

    <!-- Message Templates -->
    <template id="user-message-template">
        <div class="flex justify-end">
            <div class="bg-blue-600 text-white p-4 rounded-2xl max-w-2xl shadow-sm">
                <p class="whitespace-pre-wrap text-sm"></p>
            </div>
        </div>
    </template>

    <template id="ai-message-template">
        <div class="flex justify-start">
            <div class="bg-gray-200 text-gray-900 p-4 rounded-2xl max-w-2xl shadow-sm relative group">
                <p class="whitespace-pre-wrap text-sm mb-3"></p>
                <div class="flex items-center justify-between pt-2 border-t border-gray-300">
                    <div class="flex space-x-1">
                        <button class="like-btn text-gray-500 hover:text-gray-700 transition-colors">
                            <i class="far fa-thumbs-up text-xs"></i>
                        </button>
                        <button class="dislike-btn text-gray-500 hover:text-gray-700 transition-colors">
                            <i class="far fa-thumbs-down text-xs"></i>
                        </button>
                    </div>
                    <button class="copy-btn text-gray-500 hover:text-gray-700 transition-colors flex items-center space-x-1">
                        <i class="far fa-copy text-xs"></i>
                        <span class="text-xs">Copy</span>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <template id="status-item-template">
        <div class="status-item flex items-start space-x-3">
            <div class="status-icon mt-1">
                <i class="fas fa-circle-notch text-blue-600 text-xs animate-spin"></i>
            </div>
            <div class="flex-1">
                <p class="text-sm font-medium text-gray-900 status-name">Đang xử lý...</p>
                <p class="text-xs text-gray-600 status-message mt-1">Vui lòng đợi</p>
            </div>
        </div>
    </template>

    <script src="/static/app.js"></script>
</body>
</html>
